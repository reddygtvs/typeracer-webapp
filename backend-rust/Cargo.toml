[package]
name = "typeracer-backend-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Data processing
polars = { version = "0.45", features = ["lazy", "csv", "temporal", "strings", "dtype-datetime"] }

# Visualization
plotly = "0.8"

# HTTP and middleware
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Error handling and logging
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Hashing for cache keys
sha2 = "0.10"

# Memory-efficient collections
dashmap = "6.0"

[dev-dependencies]
# Testing HTTP requests
reqwest = { version = "0.12", features = ["json"] }